<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KawanKonten — Manage Campaigns</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared.css">
<link rel="stylesheet" href="responsive.css">
</head>
<body>

<!-- NAV -->
<nav class="nav">
  <div class="wrap nav-inner">
    <a href="index.html" class="nav-logo">
      <div class="nav-logo-icon">
        <svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="10" fill="white" fill-opacity="0.2"/><path d="M8 12C8 9.79 9.79 8 12 8s4 1.79 4 4-1.79 4-4 4-4-1.79-4-4z" fill="white"/><circle cx="17" cy="7" r="2" fill="#00C896"/></svg>
      </div>
      <span><span class="logo-kawan">Kawan</span><span class="logo-konten">Konten</span></span>
    </a>
    <div class="nav-links">
      <a href="brand.html">Dashboard</a>
      <a href="explore.html">Find Creators</a>
      <a href="campaigns.html" class="active">Campaigns</a>
      <a href="ads.html">Ads</a>
      <a href="chat.html">Messages</a>
    </div>
    <div class="nav-right">
      <a href="index.html" class="mode-pill">
        <span class="mode-dot"></span> Brand Mode
      </a>
    </div>
  </div>
</nav>

<div class="wrap" style="padding-top:36px;padding-bottom:48px;">

  <!-- Page Header -->
  <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:28px;flex-wrap:wrap;gap:16px;">
    <div style="display:flex;align-items:center;gap:12px;">
      <a href="brand.html" style="width:36px;height:36px;border-radius:999px;background:var(--bg);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:16px;color:var(--ink-3);text-decoration:none;">←</a>
      <div>
        <p class="section-eyebrow">Brand Workspace</p>
        <h1 style="font-size:28px;font-weight:800;color:var(--ink);letter-spacing:-0.02em;">Manage Campaigns</h1>
      </div>
    </div>
    <button class="btn btn-primary" onclick="openModal('modal-new-campaign')">+ New Campaign</button>
  </div>

  <!-- Summary Stats -->
  <div class="stat-grid" style="margin-bottom:28px;">
    <div class="stat-card">
      <div class="stat-icon violet"><svg width="20" height="20" viewBox="0 0 24 24" fill="none"><rect x="3" y="3" width="8" height="8" rx="2" fill="#5B4FE8"/><rect x="13" y="3" width="8" height="8" rx="2" fill="#5B4FE8" fill-opacity="0.4"/><rect x="3" y="13" width="8" height="8" rx="2" fill="#5B4FE8" fill-opacity="0.4"/><rect x="13" y="13" width="8" height="8" rx="2" fill="#5B4FE8" fill-opacity="0.4"/></svg></div>
      <div class="stat-num">04</div>
      <div class="stat-label">Total Campaigns</div>
      <div class="stat-sub">3 active, 1 completed</div>
    </div>
    <div class="stat-card">
      <div class="stat-icon green"><svg width="20" height="20" viewBox="0 0 24 24" fill="none"><rect x="3" y="12" width="4" height="9" rx="1" fill="#00C896"/><rect x="10" y="7" width="4" height="14" rx="1" fill="#00C896"/><rect x="17" y="3" width="4" height="18" rx="1" fill="#00C896"/></svg></div>
      <div class="stat-num">Rp 31M</div>
      <div class="stat-label">Total Budget</div>
      <div class="stat-sub">across all campaigns</div>
    </div>
    <div class="stat-card">
      <div class="stat-icon blue"><svg width="20" height="20" viewBox="0 0 24 24" fill="none"><circle cx="9" cy="7" r="3" fill="#3B82F6"/><path d="M3 19c0-3.314 2.686-6 6-6s6 2.686 6 6" stroke="#3B82F6" stroke-width="2" stroke-linecap="round"/></svg></div>
      <div class="stat-num">31</div>
      <div class="stat-label">Creators Involved</div>
      <div class="stat-sub">across all campaigns</div>
    </div>
    <div class="stat-card">
      <div class="stat-icon yellow"><svg width="20" height="20" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="9" stroke="#F6A623" stroke-width="2"/><path d="M8 12l3 3 5-5" stroke="#F6A623" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
      <div class="stat-num">22</div>
      <div class="stat-label">Content Approved</div>
      <div class="stat-sub">out of 31 submitted</div>
    </div>
  </div>

  <!-- Filter Tabs -->
  <div style="display:flex;gap:10px;margin-bottom:28px;flex-wrap:wrap;">
    <button class="chip-filter active" id="filter-all"      onclick="filterCampaign('All', this)">All</button>
    <button class="chip-filter"        id="filter-active"   onclick="filterCampaign('Active', this)">Active</button>
    <button class="chip-filter"        id="filter-completed" onclick="filterCampaign('Completed', this)">Completed</button>
  </div>

  <!-- Campaign List -->
  <div id="campaign-list" style="display:flex;flex-direction:column;gap:16px;"></div>

</div>

<!-- New Campaign Modal -->
<div class="modal-overlay" id="modal-new-campaign">
  <div class="modal">
    <div class="modal-header">
      <h3>Create New Campaign</h3>
      <button class="modal-close" onclick="closeModal('modal-new-campaign')">×</button>
    </div>
    <div style="display:flex;flex-direction:column;gap:14px;">
      <div>
        <label class="field-label">Campaign Name</label>
        <input class="field" placeholder="e.g. Summer Glow 2026">
      </div>
      <div>
        <label class="field-label">Content Type</label>
        <select class="field">
          <option>UGC Video</option>
          <option>Instagram Reels</option>
          <option>TikTok Video</option>
          <option>Story Series</option>
          <option>Mixed</option>
        </select>
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;">
        <div>
          <label class="field-label">Number of Creators</label>
          <input class="field" type="number" placeholder="e.g. 10">
        </div>
        <div>
          <label class="field-label">Total Budget (Rp)</label>
          <input class="field" type="number" placeholder="e.g. 10000000">
        </div>
      </div>
      <div>
        <label class="field-label">Campaign Brief</label>
        <textarea class="field" rows="4" placeholder="Describe your campaign goals, target audience, and content direction..."></textarea>
      </div>
    </div>
    <button class="modal-btn-full" onclick="closeModal('modal-new-campaign');alert('Campaign created!')">Launch Campaign</button>
  </div>
</div>

<button class="fab-help" onclick="alert('Need help? Contact support@kawankonten.id')">?</button>

<script src="shared.js"></script>
<script>
var activeFilter = 'All';

function filterCampaign(filter, btn) {
  activeFilter = filter;
  document.querySelectorAll('.chip-filter').forEach(function(b){ b.classList.remove('active'); });
  btn.classList.add('active');
  renderCampaignList();
}

function renderCampaignList() {
  var list = document.getElementById('campaign-list');
  if (!list) return;
  list.innerHTML = '';
  var filtered = campaigns.filter(function(c) {
    return activeFilter === 'All' || c.status === activeFilter;
  });
  if (filtered.length === 0) {
    list.innerHTML = '<div style="text-align:center;padding:48px;color:var(--ink-3);">No campaigns found.</div>';
    return;
  }
  filtered.forEach(function(c) {
    var isActive = c.status === 'Active';
    var card = document.createElement('div');
    card.className = 'card';
    card.style.padding = '24px';
    card.innerHTML =
      '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;flex-wrap:wrap;gap:12px;">' +
        '<div style="display:flex;align-items:center;gap:12px;">' +
          '<h3 style="font-size:18px;font-weight:800;color:var(--ink);">' + c.name + '</h3>' +
          '<span class="badge ' + (isActive ? 'badge-green' : 'badge-grey') + '">' + c.status + '</span>' +
          '<span style="font-size:12px;color:var(--ink-3);">' + c.category + '</span>' +
        '</div>' +
        '<div style="display:flex;gap:8px;">' +
          '<a href="chat.html" class="btn btn-outline btn-sm">Message Creators</a>' +
          '<button class="btn btn-primary btn-sm" onclick="openModal(\'modal-new-campaign\')">Edit</button>' +
        '</div>' +
      '</div>' +
      '<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:20px;">' +
        '<div style="text-align:center;background:var(--bg);border-radius:var(--radius-s);padding:14px;">' +
          '<div style="font-size:20px;font-weight:800;color:var(--ink);">' + c.creators + '</div>' +
          '<div style="font-size:11px;color:var(--ink-3);text-transform:uppercase;letter-spacing:0.04em;margin-top:2px;">Creators</div>' +
        '</div>' +
        '<div style="text-align:center;background:var(--bg);border-radius:var(--radius-s);padding:14px;">' +
          '<div style="font-size:20px;font-weight:800;color:var(--ink);">' + c.sent + '</div>' +
          '<div style="font-size:11px;color:var(--ink-3);text-transform:uppercase;letter-spacing:0.04em;margin-top:2px;">Submitted</div>' +
        '</div>' +
        '<div style="text-align:center;background:var(--bg);border-radius:var(--radius-s);padding:14px;">' +
          '<div style="font-size:20px;font-weight:800;color:var(--green);">' + c.approved + '</div>' +
          '<div style="font-size:11px;color:var(--ink-3);text-transform:uppercase;letter-spacing:0.04em;margin-top:2px;">Approved</div>' +
        '</div>' +
        '<div style="text-align:center;background:var(--bg);border-radius:var(--radius-s);padding:14px;">' +
          '<div style="font-size:20px;font-weight:800;color:var(--primary);">' + c.budget + '</div>' +
          '<div style="font-size:11px;color:var(--ink-3);text-transform:uppercase;letter-spacing:0.04em;margin-top:2px;">Budget</div>' +
        '</div>' +
      '</div>' +
      '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;">' +
        '<span style="font-size:12px;color:var(--ink-3);">Campaign progress</span>' +
        '<span style="font-size:12px;font-weight:700;color:var(--ink);">' + c.progress + '%</span>' +
      '</div>' +
      '<div class="progress-track"><div class="progress-fill" style="width:' + c.progress + '%;background:' + (c.progress === 100 ? 'var(--green)' : 'var(--primary)') + ';"></div></div>';
    list.appendChild(card);
  });
}

document.addEventListener('DOMContentLoaded', renderCampaignList);
</script>
<script src="responsive.js"></script>
</body>
</html>
