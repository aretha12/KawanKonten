<style>
  .chat-layout {
    display: grid;
    grid-template-columns: 320px 1fr;
    height: calc(100vh - 64px);
    overflow: hidden;
  }
  /* Sidebar */
  .chat-sidebar {
    border-right: 1px solid var(--border);
    background: #fff;
    display: flex; flex-direction: column;
    overflow: hidden;
  }
  .chat-sidebar-header {
    padding: 20px 20px 16px;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  .chat-search {
    position: relative; margin-top: 12px;
  }
  .chat-search input {
    width: 100%; padding: 9px 12px 9px 36px;
    border: 1.5px solid var(--border); border-radius: 999px;
    font-size: 13px; font-family: inherit;
    background: var(--bg); color: var(--ink); outline: none;
  }
  .chat-search input:focus { border-color: var(--primary); }
  .chat-search svg { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); }
  .chat-thread-list {
    flex: 1; overflow-y: auto;
  }
  .chat-thread {
    display: flex; align-items: center; gap: 12px;
    padding: 14px 20px; cursor: pointer;
    border-bottom: 1px solid var(--border);
    transition: background .12s;
    position: relative;
  }
  .chat-thread:hover  { background: var(--bg); }
  .chat-thread.active { background: var(--primary-light); }
  .chat-thread-avatar {
    width: 44px; height: 44px; border-radius: 50%;
    object-fit: cover; flex-shrink: 0;
  }
  .chat-thread-avatar-letter {
    width: 44px; height: 44px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 16px; font-weight: 800; flex-shrink: 0;
  }
  .chat-thread-name  { font-size: 14px; font-weight: 700; color: var(--ink); }
  .chat-thread-preview { font-size: 12px; color: var(--ink-3); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 180px; }
  .chat-thread-time  { font-size: 11px; color: var(--ink-4); position: absolute; top: 14px; right: 16px; }
  .chat-thread-unread {
    width: 18px; height: 18px; border-radius: 50%;
    background: var(--primary); color: #fff;
    font-size: 10px; font-weight: 800;
    display: flex; align-items: center; justify-content: center;
    position: absolute; bottom: 14px; right: 16px;
  }
  /* Main chat area */
  .chat-main {
    display: flex; flex-direction: column; overflow: hidden;
    background: var(--bg);
  }
  .chat-main-header {
    background: #fff; border-bottom: 1px solid var(--border);
    padding: 16px 24px;
    display: flex; align-items: center; gap: 14px; flex-shrink: 0;
  }
  .chat-messages {
    flex: 1; overflow-y: auto;
    padding: 24px; display: flex; flex-direction: column; gap: 16px;
  }
  .msg { display: flex; gap: 10px; align-items: flex-end; max-width: 72%; }
  .msg.sent { align-self: flex-end; flex-direction: row-reverse; }
  .msg-avatar { width: 32px; height: 32px; border-radius: 50%; object-fit: cover; flex-shrink: 0; }
  .msg-avatar-letter { width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 800; flex-shrink: 0; }
  .msg-bubble {
    padding: 12px 16px; border-radius: 18px;
    font-size: 14px; line-height: 1.5; color: var(--ink);
    background: #fff; border: 1px solid var(--border);
    border-bottom-left-radius: 4px;
    box-shadow: 0 1px 2px rgba(0,0,0,0.05);
  }
  .msg.sent .msg-bubble {
    background: var(--primary); color: #fff; border: none;
    border-bottom-right-radius: 4px; border-bottom-left-radius: 18px;
  }
  .msg-time { font-size: 11px; color: var(--ink-4); margin-top: 4px; text-align: right; }
  .msg.sent .msg-time { text-align: left; }
  /* Attachment / brief card inside bubble */
  .msg-card {
    background: rgba(255,255,255,0.15); border-radius: 10px;
    padding: 10px 14px; margin-top: 8px; border: 1px solid rgba(255,255,255,0.25);
  }
  .msg-card-recv {
    background: var(--bg); border-radius: 10px;
    padding: 10px 14px; margin-top: 8px; border: 1px solid var(--border);
  }
  /* Input area */
  .chat-input-area {
    background: #fff; border-top: 1px solid var(--border);
    padding: 16px 24px; flex-shrink: 0;
  }
  .chat-input-row {
    display: flex; gap: 10px; align-items: flex-end;
  }
  .chat-input-box {
    flex: 1;
    padding: 12px 16px;
    border: 1.5px solid var(--border);
    border-radius: var(--radius-m);
    font-size: 14px; font-family: inherit;
    background: var(--bg); color: var(--ink);
    outline: none; resize: none; max-height: 120px;
    line-height: 1.5;
  }
  .chat-input-box:focus { border-color: var(--primary); }
  .chat-send-btn {
    width: 44px; height: 44px; border-radius: 50%;
    background: var(--primary); border: none; color: #fff;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; flex-shrink: 0; transition: background .15s;
  }
  .chat-send-btn:hover { background: var(--primary-dark); }
  .chat-tools { display: flex; gap: 8px; margin-bottom: 10px; }
  .chat-tool-btn {
    font-size: 12px; font-weight: 600; color: var(--ink-3);
    background: var(--bg); border: 1.5px solid var(--border);
    border-radius: 999px; padding: 5px 12px; cursor: pointer;
    display: flex; align-items: center; gap: 5px;
    transition: border-color .15s;
  }
  .chat-tool-btn:hover { border-color: var(--primary); color: var(--primary); }
  /* Empty state */
  .chat-empty {
    flex: 1; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 12px;
    color: var(--ink-3);
  }
  @media (max-width: 768px) {
    .chat-layout { grid-template-columns: 1fr; }
    .chat-sidebar { display: none; }
    .chat-sidebar.show { display: flex; position: fixed; inset: 0; z-index: 99; width: 100%; }
  }
</style>

            Propose Rate

          <button class="chat-tool-btn">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none"><rect x="3" y="3" width="18" height="18" rx="2" stroke="currentColor" stroke-width="2" fill="none"/><circle cx="8.5" cy="8.5" r="1.5" fill="currentColor"/><polyline points="21,15 16,10 5,21" stroke="currentColor" stroke-width="2" fill="none"/></svg>

            oninput="this.style.height='auto';this.style.height=Math.min(this.scrollHeight,120)+'px'"></textarea>

var activeThreadId = null;

// ============================================================
// RENDER SIDEBAR
// ============================================================
function renderThreads(filter) {
  var list = document.getElementById('thread-list');
  list.innerHTML = '';
  var filtered = threads.filter(function(t) {
    if (!filter) return true;
    return t.name.toLowerCase().includes(filter.toLowerCase());
  });
  filtered.forEach(function(t) {
    var el = document.createElement('div');
    el.className = 'chat-thread' + (t.id === activeThreadId ? ' active' : '');
    el.onclick = function() { openThread(t.id); };
    var avatarHtml = t.avatar
      ? '<img class="chat-thread-avatar" src="' + t.avatar + '" alt="' + t.name + '">'
      : '<div class="chat-thread-avatar-letter" style="background:' + t.bg + ';color:' + t.fg + ';">' + t.letter + '</div>';
    el.innerHTML =
      avatarHtml +
      '<div style="flex:1;min-width:0;">' +
        '<div style="display:flex;align-items:center;gap:6px;">' +
          '<span class="chat-thread-name">' + t.name + '</span>' +
          '<span style="font-size:10px;font-weight:600;background:' + (t.role === 'Brand' ? 'var(--green-light)' : 'var(--primary-light)') + ';color:' + (t.role === 'Brand' ? '#059669' : 'var(--primary)') + ';padding:2px 6px;border-radius:999px;">' + t.role + '</span>' +
        '</div>' +
        '<div class="chat-thread-preview">' + t.preview + '</div>' +
      '</div>' +
      '<span class="chat-thread-time">' + t.time + '</span>' +
      (t.unread > 0 ? '<span class="chat-thread-unread">' + t.unread + '</span>' : '');
    list.appendChild(el);
  });
}

function filterThreads(val) { renderThreads(val); }

// ============================================================
// OPEN THREAD
// ============================================================
function openThread(id) {
  var t = threads.find(function(x){ return x.id === id; });
  if (!t) return;
  activeThreadId = id;
  t.unread = 0;

  // Show active-chat
  document.getElementById('chat-empty').style.display = 'none';
  var ac = document.getElementById('active-chat');
  ac.style.display = 'flex';

  // Header
  var avatarEl = document.getElementById('chat-partner-avatar');
  avatarEl.innerHTML = t.avatar
    ? '<img class="chat-thread-avatar" src="' + t.avatar + '" alt="' + t.name + '" style="width:40px;height:40px;">'
    : '<div class="chat-thread-avatar-letter" style="background:' + t.bg + ';color:' + t.fg + ';width:40px;height:40px;">' + t.letter + '</div>';
  document.getElementById('chat-partner-name').textContent = t.name + ' · ' + t.role;
  document.getElementById('chat-partner-status').textContent = '● Online';

  // Render messages
  renderMessages(t);
  renderThreads();
}

function renderMessages(t) {
  var area = document.getElementById('messages-area');
  area.innerHTML = '';

  // Date separator
  var sep = document.createElement('div');
  sep.style.cssText = 'text-align:center;font-size:11px;font-weight:600;color:var(--ink-4);margin:8px 0;';
  sep.textContent = 'Today';
  area.appendChild(sep);

  t.messages.forEach(function(m) {
    var row = document.createElement('div');
    row.className = 'msg' + (m.from === 'me' ? ' sent' : '');

    var avatarHtml = m.from === 'me'
      ? '<div class="msg-avatar-letter" style="background:var(--primary-light);color:var(--primary);">Y</div>'
      : (t.avatar
          ? '<img class="msg-avatar" src="' + t.avatar + '" alt="">'
          : '<div class="msg-avatar-letter" style="background:' + t.bg + ';color:' + t.fg + ';">' + t.letter + '</div>');

    var briefHtml = '';
    if (m.brief) {
      var cls = m.from === 'me' ? 'msg-card' : 'msg-card-recv';
      briefHtml =
        '<div class="' + cls + '">' +
          '<div style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.06em;opacity:0.7;margin-bottom:6px;">📄 Campaign Brief</div>' +
          '<div style="font-size:13px;font-weight:700;margin-bottom:4px;">' + m.brief.campaign + '</div>' +
          '<div style="font-size:12px;opacity:0.8;margin-bottom:2px;">' + m.brief.type + '</div>' +
          '<div style="font-size:12px;opacity:0.8;margin-bottom:2px;">Rate: ' + m.brief.rate + '</div>' +
          '<div style="font-size:12px;opacity:0.8;">Deadline: ' + m.brief.deadline + '</div>' +
        '</div>';
    }

    row.innerHTML =
      avatarHtml +
      '<div>' +
        '<div class="msg-bubble">' + m.text + briefHtml + '</div>' +
        '<div class="msg-time">' + m.time + '</div>' +
      '</div>';
    area.appendChild(row);
  });

  area.scrollTop = area.scrollHeight;
}

// ============================================================
// SEND MESSAGE
// ============================================================
function sendMessage() {
  var input = document.getElementById('msg-input');
  var text = input.value.trim();
  if (!text || !activeThreadId) return;
  var t = threads.find(function(x){ return x.id === activeThreadId; });
  if (!t) return;

  var now = new Date();
  var timeStr = now.getHours() + ':' + String(now.getMinutes()).padStart(2,'0') + ' ' + (now.getHours() >= 12 ? 'PM' : 'AM');
  t.messages.push({ from: 'me', text: text, time: timeStr });
  t.preview = text;
  t.time = 'Now';

  input.value = '';
  input.style.height = 'auto';
  renderMessages(t);
  renderThreads();

  // Simulate reply after 1.5s
  setTimeout(function() {
    var replies = [
      "Got it, thanks for the update!",
      "Sounds great! Let me check with my team.",
      "Perfect. I'll get back to you shortly.",
      "Noted — I'll review and send feedback by EOD.",
      "Appreciate the quick response! 🙏"
    ];
    t.messages.push({ from: 'them', text: replies[Math.floor(Math.random() * replies.length)], time: timeStr });
    t.preview = t.messages[t.messages.length-1].text;
    renderMessages(t);
    renderThreads();
  }, 1500);
}

function handleEnter(e) {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
}

// ============================================================
// START NEW CONVERSATION
// ============================================================
function startConversation() {
  var to   = document.getElementById('new-msg-to').value;
  var body = document.getElementById('new-msg-body').value.trim();
  if (!to || !body) { alert('Please select a recipient and write a message.'); return; }
  closeModal('modal-new-message');

  var parts = to.split(' (');
  var newName = parts[0];
  var newRole = parts[1] ? parts[1].replace(')','') : 'Brand';
  var letters = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
  var colors  = ['#FECACA','#FEF3C7','#D1FAE5','#DBEAFE','#EDE9FE','#FEE2E2'];
  var fgColors= ['#DC2626','#D97706','#059669','#2563EB','#7C3AED','#DC2626'];
  var idx     = Math.floor(Math.random() * colors.length);
  var newId   = threads.length + 1;

  var now = new Date();
  var timeStr = now.getHours() + ':' + String(now.getMinutes()).padStart(2,'0');

  threads.unshift({
    id: newId, name: newName, role: newRole,
    avatar: null, letter: newName[0].toUpperCase(),
    bg: colors[idx], fg: fgColors[idx],
    preview: body, time: 'Now', unread: 0,
    messages: [{ from: 'me', text: body, time: timeStr }]
  });

  renderThreads();
  openThread(newId);
}

// ============================================================
// SEND BRIEF / OFFER
// ============================================================
function sendBrief() {
  closeModal('modal-send-brief');
  if (!activeThreadId) return;
  var t = threads.find(function(x){ return x.id === activeThreadId; });
  if (!t) return;
  var now = new Date();
  var ts  = now.getHours() + ':' + String(now.getMinutes()).padStart(2,'0');
  t.messages.push({
    from: 'me',
    text: 'I\'ve sent you the campaign brief. Please review at your convenience.',
    time: ts,
    brief: { campaign: 'New Campaign', type: '1× TikTok Video', rate: 'Rp 1.2M', deadline: 'TBD' }
  });
  t.preview = 'Brief sent';
  renderMessages(t);
  renderThreads();
}

function sendOffer() {
  var amount = document.getElementById('offer-amount').value;
  closeModal('modal-send-offer');
  if (!activeThreadId || !amount) return;
  var t = threads.find(function(x){ return x.id === activeThreadId; });
  if (!t) return;
  var now = new Date();
  var ts  = now.getHours() + ':' + String(now.getMinutes()).padStart(2,'0');
  var fmt = parseInt(amount).toLocaleString('id-ID');
  t.messages.push({ from: 'me', text: 'I\'d like to propose a rate of Rp ' + fmt + ' for this collaboration. Open to discuss!', time: ts });
  t.preview = 'Rate proposed: Rp ' + fmt;
  renderMessages(t);
  renderThreads();
}

// ============================================================
// INIT
// ============================================================
document.addEventListener('DOMContentLoaded', function() {
  renderThreads();
  // Auto-open first thread
  if (threads.length > 0) openThread(threads[0].id);
});
</script>
<script src="responsive.js"></script>
</body>
